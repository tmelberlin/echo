<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo Show Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#12151c;overflow:hidden}
body{color:#eef1f6;font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
#stage{width:960px;height:480px;padding:24px;display:grid;grid-template-columns:340px minmax(0,1fr) minmax(0,1fr);gap:16px;transform-origin:center}
.g{font-family:'Space Grotesk',sans-serif;font-weight:600}
.card{background:#1c212b;border-radius:16px;padding:16px;display:flex;flex-direction:column}
.lbl{font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#a9b1c2;margin-bottom:6px}
.mut{color:#a9b1c2}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #2a303c}
.ln{min-width:44px;text-align:center;font-weight:600;font-size:14px;border-radius:6px;padding:3px 4px;color:#fff}
.dir{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.min{font-size:18px;white-space:nowrap}
.late{color:#f2b45a}.gone{text-decoration:line-through;color:#8a93a5}
.hours{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-size:13px;text-align:center}
.hours div{background:#252b37;border-radius:10px;padding:8px 0}
.hours b{display:block;font-size:16px}
.rain{color:#8fb3ff}
#night{position:fixed;inset:0;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#night .t{font-size:180px;font-weight:500;letter-spacing:-6px;color:#a3302a;line-height:1}
#night .s{font-size:20px;color:#7a2a25}
body.isnight #night{display:flex}
</style>
</head>
<body>
<div id="stage">
  <div style="display:flex;flex-direction:column;gap:16px">
    <div>
      <div id="clock" class="g" style="font-size:104px;line-height:1;letter-spacing:-3px">--:--</div>
      <div id="date" class="mut" style="font-size:20px"></div>
    </div>
    <div class="card" style="gap:12px;flex:1">
      <div style="display:flex;align-items:center;gap:14px">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="3.2" stroke="#f2b45a"/><path d="M9 2.5v1.3M3.8 4.3l.9.9M2.5 9h1.3M14.2 4.3l-.9.9" stroke="#f2b45a"/><path d="M8 20h9a4 4 0 0 0 .4-8 5 5 0 0 0-9.6 1.4A3.3 3.3 0 0 0 8 20z" stroke="#c9d2e3"/></svg>
        <div>
          <div id="temp" class="g" style="font-size:40px;line-height:1">–°</div>
          <div id="cond" class="mut" style="font-size:14px">Berlin</div>
        </div>
        <div id="minmax" class="mut" style="margin-left:auto;text-align:right;font-size:14px;line-height:1.5"></div>
      </div>
      <div id="hours" class="hours"></div>
      <div class="mut" style="display:flex;justify-content:space-between;font-size:13px"><span id="sunup"></span><span id="sundown"></span></div>
    </div>
  </div>
  <div class="card"><div class="lbl">Tram · Rathaus Lichtenberg</div><div id="depA" class="mut">Lade …</div></div>
  <div class="card"><div class="lbl">S+U Frankfurter Allee</div><div id="depB" class="mut">Lade …</div></div>
</div>
<div id="night"><div class="t g" id="nclock">--:--</div><div class="s" id="ninfo"></div></div>

<script>
{
const API='https://v6.bvg.transport.rest';
const NIGHT_FROM=22, NIGHT_TO=6;           // Nachtmodus 22–6 Uhr
const STOPS=[
  {el:'depA', q:'Rathaus Lichtenberg', p:{tram:true,bus:false,subway:false,suburban:false,regional:false,express:false}},
  {el:'depB', q:'S+U Frankfurter Allee', p:{suburban:true,subway:true,tram:false,bus:false,regional:false,express:false}}
];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
let weather=null;

function fit(){const s=Math.min(innerWidth/960,innerHeight/480);$('stage').style.transform='scale('+s+')'}
addEventListener('resize',fit);fit();

function tick(){
  const n=new Date();
  $('clock').textContent=hm(n);$('nclock').textContent=hm(n);
  $('date').textContent=n.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
  const h=n.getHours();
  document.body.classList.toggle('isnight',h>=NIGHT_FROM||h<NIGHT_TO);
  $('ninfo').textContent=n.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'})+(weather?' · '+weather:'');
}
setInterval(tick,1000);tick();
document.addEventListener('click',()=>{document.body.classList.remove('isnight');clearTimeout(window._n);window._n=setTimeout(tick,60000)});

const WC={0:'klar',1:'überwiegend klar',2:'teils bewölkt',3:'bewölkt',45:'Nebel',48:'Nebel',51:'Nieselregen',53:'Nieselregen',55:'Nieselregen',61:'leichter Regen',63:'Regen',65:'starker Regen',66:'Eisregen',67:'Eisregen',71:'leichter Schnee',73:'Schnee',75:'starker Schnee',77:'Schneegriesel',80:'Schauer',81:'Schauer',82:'starke Schauer',85:'Schneeschauer',86:'Schneeschauer',95:'Gewitter',96:'Gewitter',99:'Gewitter'};
async function loadWeather(){
  try{
    const u='https://api.open-meteo.com/v1/forecast?latitude=52.515&longitude=13.499&current=temperature_2m,weather_code&hourly=temperature_2m,precipitation_probability&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=Europe%2FBerlin&forecast_days=2';
    const d=await (await fetch(u)).json();
    const t=Math.round(d.current.temperature_2m);
    $('temp').textContent=t+'°';
    $('cond').textContent='Berlin · '+(WC[d.current.weather_code]||'');
    weather=t+'°';
    $('minmax').innerHTML='↑ '+Math.round(d.daily.temperature_2m_max[0])+'° ↓ '+Math.round(d.daily.temperature_2m_min[0])+'°<br>Regen '+esc(d.daily.precipitation_probability_max[0])+' %';
    const now=Date.now();let out=[];
    for(let i=0;i<d.hourly.time.length&&out.length<4;i++){
      const tm=new Date(d.hourly.time[i]);
      if(tm.getTime()>now&&tm.getHours()%3===0)out.push('<div><span class="mut">'+tm.getHours()+' Uhr</span><b>'+Math.round(d.hourly.temperature_2m[i])+'°</b><span class="rain">'+esc(d.hourly.precipitation_probability[i])+' %</span></div>');
    }
    $('hours').innerHTML=out.join('');
    $('sunup').textContent='Sonnenaufgang '+d.daily.sunrise[0].slice(11);
    $('sundown').textContent='Untergang '+d.daily.sunset[0].slice(11);
  }catch(e){$('cond').textContent='Wetter nicht erreichbar'}
}
loadWeather();setInterval(loadWeather,15*60000);

function color(l){
  const n=(l?.name||'');
  if(l?.product==='suburban')return '#008d4f';
  if(n==='U5')return '#7e5330';
  if(l?.product==='subway')return '#2a6eb8';
  if(l?.product==='tram')return '#cc0a22';
  return '#7a3e9d';
}
async function stopId(s){
  if(s.id)return s.id;
  const r=await (await fetch(API+'/locations?results=1&addresses=false&poi=false&query='+encodeURIComponent(s.q))).json();
  return s.id=r[0].id;
}
async function loadDeps(s){
  try{
    const id=await stopId(s);
    const qs=new URLSearchParams({duration:'60',results:'12',remarks:'false'});
    for(const k in s.p)qs.set(k,s.p[k]);
    const r=await (await fetch(API+'/stops/'+id+'/departures?'+qs)).json();
    const deps=(r.departures||r).filter(d=>d.when||d.plannedWhen).slice(0,7);
    if(!deps.length){$(s.el).textContent='Keine Abfahrten';return}
    $(s.el).className='';
    $(s.el).innerHTML=deps.map(d=>{
      const m=Math.max(0,Math.round((new Date(d.when||d.plannedWhen)-Date.now())/60000));
      const late=(d.delay||0)>=120;
      const cls=d.cancelled?'gone':(late?'late':'');
      return '<div class="row"><div class="ln" style="background:'+color(d.line)+'">'+esc(d.line?.name)+'</div><div class="dir '+cls+'">'+esc(d.direction)+'</div><div class="min g '+cls+'">'+(d.cancelled?'fällt aus':(m===0?'jetzt':m+'′'))+'</div></div>';
    }).join('');
  }catch(e){$(s.el).textContent='BVG-Daten gerade nicht erreichbar'}
}
function loadAll(){STOPS.forEach(loadDeps)}
loadAll();setInterval(loadAll,30000);
}
</script>
</body>
</html>
