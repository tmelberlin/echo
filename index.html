<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Echo Show Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#12151c;overflow:hidden}
body{color:#eef1f6;font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
#stage{width:960px;height:480px;position:relative;transform-origin:center;flex:none}
.page{position:absolute;inset:0;padding:24px 24px 28px}
#p1{display:grid;grid-template-columns:340px minmax(0,1fr) minmax(0,1fr);gap:16px}
#p2{display:none;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
body.p2 #p1{display:none}body.p2 #p2{display:grid}
.dots{position:absolute;bottom:0;left:50%;transform:translateX(-50%);display:flex}
.dots button{background:none;border:0;padding:10px 8px;cursor:pointer}
.dots i{display:block;width:8px;height:8px;border-radius:50%;background:#3a4252}
body:not(.p2) .dots button:first-child i,body.p2 .dots button:last-child i{background:#9fb4ff}
.t2{width:100%;border-collapse:collapse;font-size:14px}
.t2 td{padding:6px 4px;border-bottom:1px solid #2a303c;white-space:nowrap}
.t2 th{font-size:11px;font-weight:500;color:#a9b1c2;text-align:left;padding:0 4px 4px}
.t2 .d{overflow:hidden;text-overflow:ellipsis;max-width:150px}
.t2 .r{text-align:right}
.t2 .cd{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.warn{margin-top:auto;padding-top:8px;font-size:12px;color:#f2b45a;line-height:1.4;max-height:52px;overflow:hidden}
.upd{font-size:11px;color:#a9b1c2;font-weight:400;letter-spacing:0;text-transform:none;float:right}
.g{font-family:'Space Grotesk',sans-serif;font-weight:600}
.card{background:#1c212b;border-radius:16px;padding:16px;display:flex;flex-direction:column}
.lbl{font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#a9b1c2;margin-bottom:6px}
.mut{color:#a9b1c2}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #2a303c}
.ln{min-width:44px;text-align:center;font-weight:600;font-size:14px;border-radius:6px;padding:3px 4px;color:#fff}
.dir{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.min{font-size:18px;white-space:nowrap}.dl{font-size:13px;font-weight:500;margin-left:4px}
.late{color:#f2b45a}.gone{text-decoration:line-through;color:#8a93a5}
.hours{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-size:13px;text-align:center}
.hours div{background:#252b37;border-radius:10px;padding:8px 0}
.hours b{display:block;font-size:16px}
.rain{color:#8fb3ff}
#night{position:fixed;inset:0;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#night .t{font-size:180px;font-weight:500;letter-spacing:-6px;color:#a3302a;line-height:1}
#night .s{font-size:20px;color:#7a2a25}
body.isnight #night{display:flex}
/* Handy hochkant */
body.m{display:block;height:auto;overflow:auto}
html:has(body.m){overflow:auto;height:auto}
body.m #stage{width:auto;height:auto;transform:none!important}
body.m .page{position:static;padding:16px 16px 64px}
body.m #p1,body.m.p2 #p2{grid-template-columns:minmax(0,1fr);gap:14px}
body.m #clock{font-size:84px}
body.m .card{padding:14px}
body.m .dots{position:fixed;bottom:0;padding-bottom:env(safe-area-inset-bottom);background:#12151ccc;border-radius:12px 12px 0 0}
body.m .t2 .d{max-width:120px}
</style>
</head>
<body>
<div id="stage">
<div id="p1" class="page">
  <div style="display:flex;flex-direction:column;gap:16px">
    <div>
      <div id="clock" class="g" style="font-size:104px;line-height:1;letter-spacing:-3px">--:--</div>
      <div id="date" class="mut" style="font-size:20px"></div>
    </div>
    <div class="card" style="gap:12px;flex:1">
      <div style="display:flex;align-items:center;gap:14px">
        <div id="icon" style="width:48px;height:48px;flex:none"></div>
        <div>
          <div id="temp" class="g" style="font-size:40px;line-height:1">–°</div>
          <div id="cond" class="mut" style="font-size:14px">Berlin</div>
        </div>
        <div id="minmax" class="mut" style="margin-left:auto;text-align:right;font-size:14px;line-height:1.5"></div>
      </div>
      <div id="hours" class="hours"></div>
      <div class="mut" style="display:flex;justify-content:space-between;font-size:13px"><span id="sunup"></span><span id="sundown"></span></div>
    </div>
  </div>
  <div class="card"><div class="lbl">Tram · Rathaus Lichtenberg</div><div id="depA" class="mut">Lade …</div></div>
  <div class="card"><div class="lbl">S+U Frankfurter Allee</div><div id="depB" class="mut">Lade …</div></div>
</div>
<div id="p2" class="page">
  <div class="card"><div class="lbl">Tram · Rathaus Lichtenberg <span class="upd" id="updA"></span></div><div id="fullA" class="mut">Lade …</div><div class="warn" id="warnA"></div></div>
  <div class="card"><div class="lbl">S+U Frankfurter Allee <span class="upd" id="updB"></span></div><div id="fullB" class="mut">Lade …</div><div class="warn" id="warnB"></div></div>
</div>
<div class="dots"><button type="button" id="go1" aria-label="Seite 1"><i></i></button><button type="button" id="go2" aria-label="Seite 2"><i></i></button></div>
</div>
<div id="night"><div class="t g" id="nclock">--:--</div><div class="s" id="ninfo"></div></div>

<script>
{
const API='https://v6.bvg.transport.rest';
const NIGHT_FROM=22, NIGHT_TO=6;           // Nachtmodus 22–6 Uhr
const STOPS=[
  {el:'depA', walk:5, q:'Rathaus Lichtenberg', p:{tram:true,bus:false,subway:false,suburban:false,regional:false,express:false}},
  {el:'depB', walk:10, q:'S+U Frankfurter Allee', p:{suburban:true,subway:true,tram:false,bus:false,regional:false,express:false}}
];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
let weather=null;

function fit(){const m=innerHeight>innerWidth&&innerWidth<760;document.body.classList.toggle('m',m);if(m)return;const s=Math.min(innerWidth/960,innerHeight/480);$('stage').style.transform='scale('+s+')'}
addEventListener('resize',fit);fit();

function tick(){
  const n=new Date();
  $('clock').textContent=hm(n);$('nclock').textContent=hm(n);
  $('date').textContent=n.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
  const h=n.getHours();
  document.body.classList.toggle('isnight',h>=NIGHT_FROM||h<NIGHT_TO);
  $('ninfo').textContent=n.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'})+(weather?' · '+weather:'');
}
setInterval(tick,1000);tick();
document.addEventListener('click',()=>{document.body.classList.remove('isnight');clearTimeout(window._n);window._n=setTimeout(tick,60000)});

const WC={0:'klar',1:'überwiegend klar',2:'teils bewölkt',3:'bewölkt',45:'Nebel',48:'Nebel',51:'Nieselregen',53:'Nieselregen',55:'Nieselregen',61:'leichter Regen',63:'Regen',65:'starker Regen',66:'Eisregen',67:'Eisregen',71:'leichter Schnee',73:'Schnee',75:'starker Schnee',77:'Schneegriesel',80:'Schauer',81:'Schauer',82:'starke Schauer',85:'Schneeschauer',86:'Schneeschauer',95:'Gewitter',96:'Gewitter',99:'Gewitter'};
function icon(c,day){
  const sun='<circle cx="9" cy="9" r="3.2" stroke="#f2b45a"/><path d="M9 2.5v1.3M3.8 4.3l.9.9M2.5 9h1.3M14.2 4.3l-.9.9" stroke="#f2b45a"/>';
  const moon='<path d="M13 4.5A5 5 0 1 0 17 11a4 4 0 0 1-4-6.5z" stroke="#c9c2f2"/>';
  const cloud='<path d="M8 19h9a4 4 0 0 0 .4-8 5 5 0 0 0-9.6 1.4A3.3 3.3 0 0 0 8 19z" stroke="#c9d2e3"/>';
  const big='<path d="M7 17h10a4.5 4.5 0 0 0 .4-9 5.5 5.5 0 0 0-10.6 1.6A3.7 3.7 0 0 0 7 17z" stroke="#c9d2e3"/>';
  const rain='<path d="M9 19.5l-1 2M13 19.5l-1 2M17 19.5l-1 2" stroke="#8fb3ff"/>';
  const snow='<path d="M9 20.5h.01M13 21.5h.01M17 20.5h.01" stroke="#eef1f6" stroke-width="2.4"/>';
  const bolt='<path d="M13 17l-2 3h3l-2 3" stroke="#f2b45a"/>';
  const fog='<path d="M4 15h16M6 18.5h12" stroke="#a9b1c2"/>';
  let p;
  if(c<=1)p=day?'<circle cx="12" cy="12" r="4.5" stroke="#f2b45a"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4" stroke="#f2b45a"/>':moon.replace('M13 4.5','M14 6');
  else if(c===2)p=(day?sun:moon)+cloud;
  else if(c===3)p=big;
  else if(c<=48)p=big+fog;
  else if(c>=95)p=big+bolt;
  else if((c>=71&&c<=77)||c===85||c===86)p=big+snow;
  else p=big+rain;
  return '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">'+p+'</svg>';
}
async function loadWeather(){
  try{
    const u='https://api.open-meteo.com/v1/forecast?latitude=52.515&longitude=13.499&current=temperature_2m,weather_code,is_day&hourly=temperature_2m,precipitation_probability&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=Europe%2FBerlin&forecast_days=2';
    const d=await (await fetch(u)).json();
    const t=Math.round(d.current.temperature_2m);$('icon').innerHTML=icon(d.current.weather_code,d.current.is_day);
    $('temp').textContent=t+'°';
    $('cond').textContent='Berlin · '+(WC[d.current.weather_code]||'');
    weather=t+'°';
    $('minmax').innerHTML='↑ '+Math.round(d.daily.temperature_2m_max[0])+'° ↓ '+Math.round(d.daily.temperature_2m_min[0])+'°<br>Regen '+esc(d.daily.precipitation_probability_max[0])+' %';
    const now=Date.now();let out=[];
    for(let i=0;i<d.hourly.time.length&&out.length<4;i++){
      const tm=new Date(d.hourly.time[i]);
      if(tm.getTime()>now&&tm.getHours()%3===0)out.push('<div><span class="mut">'+tm.getHours()+' Uhr</span><b>'+Math.round(d.hourly.temperature_2m[i])+'°</b><span class="rain">'+esc(d.hourly.precipitation_probability[i])+' %</span></div>');
    }
    $('hours').innerHTML=out.join('');
    $('sunup').textContent='Sonnenaufgang '+d.daily.sunrise[0].slice(11);
    $('sundown').textContent='Untergang '+d.daily.sunset[0].slice(11);
  }catch(e){$('cond').textContent='Wetter nicht erreichbar'}
}
loadWeather();setInterval(loadWeather,15*60000);

function color(l){
  const n=(l?.name||'');
  if(l?.product==='suburban')return '#008d4f';
  if(n==='U5')return '#7e5330';
  if(l?.product==='subway')return '#2a6eb8';
  if(l?.product==='tram')return '#cc0a22';
  return '#7a3e9d';
}
function short(t){
  t=String(t||'');
  const ring=t.match(/^Ringbahn S4[12]\s*(\S*)/);if(ring)return 'Ring '+ring[1];
  t=t.replace(/^(S\+U|S|U)\s+/,'').replace(/\s*\(Berlin\)/,'').split(/[\/,]/)[0].replace(/Straße/,'Str.');
  return t.trim();
}
async function stopId(s){
  if(s.id)return s.id;
  const r=await (await fetch(API+'/locations?results=1&addresses=false&poi=false&query='+encodeURIComponent(s.q))).json();
  return s.id=r[0].id;
}
async function loadDeps(s){
  try{
    const id=await stopId(s);
    const qs=new URLSearchParams({duration:'90',results:'25',remarks:'false'});
    for(const k in s.p)qs.set(k,s.p[k]);
    const r=await (await fetch(API+'/stops/'+id+'/departures?'+qs)).json();
    const deps=(r.departures||r).filter(d=>(d.when||d.plannedWhen)&&(new Date(d.when||d.plannedWhen)-Date.now())/60000>=s.walk).slice(0,8);
    if(!deps.length){$(s.el).textContent='Keine Abfahrten';return}
    $(s.el).className='';
    $(s.el).innerHTML=deps.map(d=>{
      const m=Math.max(0,Math.round((new Date(d.when||d.plannedWhen)-Date.now())/60000));
      const dly=Math.round((d.delay||0)/60);const late=dly>=2;
      const cls=d.cancelled?'gone':(late?'late':'');
      return '<div class="row"><div class="ln" style="background:'+color(d.line)+'">'+esc(d.line?.name)+'</div><div class="dir '+cls+'">'+esc(short(d.direction))+'</div><div class="min g '+cls+'">'+(d.cancelled?'fällt aus':m+'′'+(late?'<span class="dl">+'+dly+'</span>':''))+'</div></div>';
    }).join('');
  }catch(e){$(s.el).textContent='BVG-Daten gerade nicht erreichbar'}
}
function loadAll(){STOPS.forEach(loadDeps)}
loadAll();setInterval(loadAll,30000);

// ---------- Seite 2: alle Abfahrten, Echtzeit ----------
const FULL=[{s:STOPS[0],el:'fullA',w:'warnA',u:'updA',deps:[]},{s:STOPS[1],el:'fullB',w:'warnB',u:'updB',deps:[]}];
async function loadFull(f){
  try{
    const id=await stopId(f.s);
    const qs=new URLSearchParams({duration:'60',results:'20',remarks:'true'});
    for(const k in f.s.p)qs.set(k,f.s.p[k]);
    const r=await (await fetch(API+'/stops/'+id+'/departures?'+qs)).json();
    const list=(r.departures||r).filter(d=>d.when||d.plannedWhen);
    f.deps=list;
    const seen=new Set(),warns=[];
    for(const d of list)for(const m of (d.remarks||[]))if(m.type==='warning'){const t=m.summary||m.text;if(t&&!seen.has(t)){seen.add(t);warns.push(t)}}
    $(f.w).textContent=warns.slice(0,2).map(t=>'⚠ '+t).join('  ');
    $(f.u).textContent='Stand '+hm(new Date());
  }catch(e){$(f.el).textContent='BVG-Daten gerade nicht erreichbar'}
}
function renderFull(f){
  const now=Date.now();
  const deps=f.deps.filter(d=>new Date(d.when||d.plannedWhen)-now>-30000).slice(0,9);
  if(!deps.length){if(f.deps.length||$(f.el).textContent!=='Lade …')$(f.el).textContent='Keine Abfahrten';return}
  $(f.el).className='';
  $(f.el).innerHTML='<table class="t2"><tr><th>Linie</th><th>Richtung</th><th>Gleis</th><th class="r">Plan</th><th class="r">in</th></tr>'+deps.map(d=>{
    const t=new Date(d.when||d.plannedWhen),pl=new Date(d.plannedWhen||d.when);
    const sec=Math.max(0,Math.round((t-now)/1000));
    const dly=Math.round((d.delay||0)/60);
    const cls=d.cancelled?'gone':(dly>=2?'late':'');
    const cd=d.cancelled?'fällt aus':(sec<60?'jetzt':Math.floor(sec/60)+':'+pad(sec%60));
    const plat=d.platform||d.plannedPlatform||'–';
    return '<tr><td><span class="ln" style="display:inline-block;background:'+color(d.line)+'">'+esc(d.line?.name)+'</span></td><td class="d '+cls+'">'+esc(d.direction)+'</td><td>'+esc(plat)+'</td><td class="r">'+hm(pl)+(dly>=1?' <span class="late">+'+dly+'</span>':'')+'</td><td class="cd '+cls+'">'+cd+'</td></tr>';
  }).join('')+'</table>';
}
function showPage(n){
  document.body.classList.toggle('p2',n===2);
  if(n===2){FULL.forEach(loadFull);FULL.forEach(renderFull)}
}
setInterval(()=>{if(document.body.classList.contains('p2'))FULL.forEach(loadFull)},10000);
setInterval(()=>{if(document.body.classList.contains('p2'))FULL.forEach(renderFull)},1000);
$('go1').addEventListener('click',()=>showPage(1));
$('go2').addEventListener('click',()=>showPage(2));
let tx=null;
let ty=0;addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;if(Math.abs(dy)>Math.abs(dx))return;if(dx<-50)showPage(2);else if(dx>50)showPage(1)});
}
</script>
</body>
</html>
